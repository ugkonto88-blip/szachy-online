# fly.toml app configuration file generated for szachy-online on 2026-11-17T00:43:55+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'szachy-online'
primary_region = 'ams'

[build]
[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8080'
  PUBLIC_URL = 'https://szachy-online.fly.dev'

[[mounts]]
  source = 'szachy_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
